name: Build world and deploy atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            atlas/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix atlas
      - name: Unit tests and typecheck
        run: |
          npm test
          npm run typecheck
      - name: Simulate, generate the archive, audit, export
        run: npm run build:data
        env:
          PAL_CARDS: '1' # reading pages point at the social cards rendered below
      - name: Build the atlas
        run: npm --prefix atlas run build
      - name: Social cards for the reading pages
        working-directory: atlas
        timeout-minutes: 10
        continue-on-error: true # a missing card only costs a link preview; never hold the deploy
        run: |
          npx playwright install --with-deps chromium
          npm run cards
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
